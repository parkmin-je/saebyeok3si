# 2000년대 학창시절 추억 소재 은행. plan 단계가 최근에 안 쓴 것을 고른다.
# 실제 작품명·캐릭터·노래·상표는 쓰지 않는다 (분위기만).
tone: >-
  2000년대 초중반 한국 학창시절. 풋풋한 학원 로맨스 분위기(별이삼샵, 연애혁명, 꽃보다남자 같은 느낌이지만
  작품명·캐릭터·장면은 절대 쓰지 않는다). 아이들이 휴대폰 대신 밖에서 몸으로 놀던 시절에 대한 그리움.
  첫 장면은 지금(휴대폰만 보는 요즘 아이들, 텅 빈 놀이터 등)과 대비하고, 마지막은 여운 한 줄.
