name: cast
# 연재 드라마 주인공 후보 얼굴 (무료 CPU). 결과는 experiment-output 브랜치 runs/cast-<id>/
on:
  push:
    branches: [feat/sample-video-veo]
    paths: [pipeline/experiments/cast_portraits.py, .github/workflows/cast.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install diffusers==0.31.0 transformers==4.46.3 accelerate==1.1.1 peft==0.13.2 safetensors pillow numpy huggingface_hub
      - name: Generate and push each portrait
        run: |
          git config --global user.name "rrs-bot"; git config --global user.email "rrs-bot@users.noreply.github.com"
          python pipeline/experiments/cast_portraits.py &
          P=$!
          push() { rm -rf /tmp/w; git fetch -q origin experiment-output && git worktree add -q -B experiment-output /tmp/w origin/experiment-output && mkdir -p /tmp/w/runs/cast-${{ github.run_id }} && cp out/cast/*.png /tmp/w/runs/cast-${{ github.run_id }}/ 2>/dev/null && (cd /tmp/w && git add runs && git commit -qm "cast" && git push -q origin experiment-output); git worktree remove --force /tmp/w || true; }
          while kill -0 $P 2>/dev/null; do sleep 240; push || true; done
          wait $P; push || true
