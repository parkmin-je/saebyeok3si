name: hf-space-clip
# 무료 Hugging Face Space(ZeroGPU) Wan 2.2로 빠른 시험 컷 (Kaggle 대기열 우회)
on:
  push:
    branches: [feat/sample-video-veo]
    paths: [pipeline/experiments/hf_space_i2v.py, pipeline/experiments/hf-space-job.json, .github/workflows/hf-space-clip.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: "hfspace-${{ github.sha }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q gradio_client
      - name: Generate
        run: |
          git fetch -q origin experiment-output && git worktree add -q /tmp/eo origin/experiment-output
          IMG=$(python -c "import json;print(json.load(open('pipeline/experiments/hf-space-job.json'))['image'])")
          PROMPT=$(python -c "import json;print(json.load(open('pipeline/experiments/hf-space-job.json'))['prompt'])")
          python pipeline/experiments/hf_space_i2v.py "/tmp/eo/$IMG" "$PROMPT" out/hf
      - name: Push results
        if: always()
        run: |
          git config --global user.name "rrs-bot"; git config --global user.email "rrs-bot@users.noreply.github.com"
          cd /tmp/eo && git checkout -q -B experiment-output && git pull -q origin experiment-output || true
          mkdir -p runs/hfspace-${{ github.run_id }} && cp -r $GITHUB_WORKSPACE/out/hf/* runs/hfspace-${{ github.run_id }}/ 2>/dev/null || true
          git add runs && git commit -qm "hfspace ${{ github.run_id }}" && git push -q origin experiment-output || true
