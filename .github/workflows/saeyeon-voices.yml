name: saeyeon-voices
# 느린 우체통 목소리 만들기 (Supertonic 3, CPU, 무료). episode.json 을 올리면 voice/*.wav 를
# experiment-output 브랜치 runs/voices-<id>-<run>/ 에 올린다. 목소리 10종 견본도 같이 만든다.
on:
  push:
    branches: [feat/sample-video-veo]
    paths: [pipeline/saeyeon/ep*/episode.json, pipeline/saeyeon/shorts/*.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: "voices-${{ github.sha }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q supertonic==1.3.1 soundfile numpy pyyaml
      - name: Voices
        run: |
          git config --global user.name "rrs-bot"; git config --global user.email "rrs-bot@users.noreply.github.com"
          FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'pipeline/saeyeon/ep*/episode.json' 'pipeline/saeyeon/shorts/*.json')
          [ -z "$FILES" ] && FILES=$(ls pipeline/saeyeon/ep*/episode.json | tail -1)
          git fetch -q origin experiment-output && git worktree add -q -B eo-work /tmp/eo origin/experiment-output
          OUT=/tmp/eo/runs/voices-${{ github.run_id }}
          mkdir -p $OUT/voice
          for E in $FILES; do python pipeline/saeyeon/build.py "$E" /tmp/work --voices-only; done
          cp /tmp/work/voice/*.wav $OUT/voice/
          cd /tmp/eo && git add runs && git commit -qm "voices ${{ github.run_id }}" && for i in 1 2 3; do git pull -q --rebase origin experiment-output && git push -q origin HEAD:experiment-output && break; sleep 5; done
