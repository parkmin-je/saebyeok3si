name: saeyeon-voices
# 느린 우체통 목소리 만들기 (Supertonic 3, CPU, 무료). episode.json 을 올리면 voice/*.wav 를
# experiment-output 브랜치 runs/voices-<id>-<run>/ 에 올린다. 목소리 10종 견본도 같이 만든다.
on:
  push:
    branches: [feat/sample-video-veo]
    paths: [pipeline/saeyeon/ep*/episode.json, .github/workflows/saeyeon-voices.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: "voices-${{ github.sha }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q supertonic==1.3.1 soundfile numpy pyyaml
      - name: Voices
        run: |
          git config --global user.name "rrs-bot"; git config --global user.email "rrs-bot@users.noreply.github.com"
          E=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'pipeline/saeyeon/ep*/episode.json' | head -1)
          [ -z "$E" ] && E=$(ls pipeline/saeyeon/ep*/episode.json | tail -1)
          ID=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$E")
          git fetch -q origin experiment-output && git worktree add -q -B eo-work /tmp/eo origin/experiment-output
          OUT=/tmp/eo/runs/voices-$ID-${{ github.run_id }}
          mkdir -p $OUT/samples
          python - "$OUT/samples" <<'PY'
          import sys, soundfile as sf, numpy as np
          from supertonic import TTS
          t = TTS(auto_download=True)
          line = "안녕하세요, 느린 우체통입니다. 오늘도 지나간 시간에서 늦게 도착한 편지 한 통을 천천히 읽어드리겠습니다."
          for v in [f"{g}{i}" for g in "MF" for i in range(1, 6)]:
              w, _ = t.synthesize(line, voice_style=t.get_voice_style(voice_name=v), lang="ko", speed=0.92, total_steps=10)
              sf.write(f"{sys.argv[1]}/{v}.wav", np.asarray(w).reshape(-1), t.sample_rate)
          PY
          time python pipeline/saeyeon/build.py "$E" /tmp/work --voices-only
          cp -r /tmp/work/voice $OUT/voice
          cd /tmp/eo && git add runs && git commit -qm "voices $ID ${{ github.run_id }}" && for i in 1 2 3; do git pull -q --rebase origin experiment-output && git push -q origin HEAD:experiment-output && break; sleep 5; done
