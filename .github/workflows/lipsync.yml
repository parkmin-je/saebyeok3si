name: lipsync
# 입 모양 맞추기 (MuseTalk v1.5, MIT). 입력: pipeline/experiments/lipsync-jobs/<이름>.json
# {"items":[{"name","video":"eo:runs/...mp4" 또는 저장소 경로,"audio":저장소 경로 wav,"lead":0.15}]}
on:
  push:
    branches: [feat/sample-video-veo]
    paths: [pipeline/experiments/lipsync-jobs/**]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: "lipsync-${{ github.sha }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install MuseTalk (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          git clone -q https://github.com/TMElyralab/MuseTalk.git /tmp/MuseTalk
          git -C /tmp/MuseTalk checkout -q 2536eaf06b85f775d8e04b7fd81bf6699155a58d
          pip install -q torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "diffusers==0.30.2" "transformers==4.39.2" "accelerate==0.28.0" "huggingface_hub==0.30.2" \
            face-alignment librosa soundfile "opencv-python-headless<5" einops omegaconf pyyaml tqdm gdown "numpy<2" imageio imageio-ffmpeg
          python pipeline/experiments/musetalk_patch.py /tmp/MuseTalk
          cd /tmp/MuseTalk
          mkdir -p models/musetalkV15 models/sd-vae models/whisper models/face-parse-bisent
          huggingface-cli download TMElyralab/MuseTalk --local-dir models --include "musetalkV15/musetalk.json" "musetalkV15/unet.pth"
          huggingface-cli download stabilityai/sd-vae-ft-mse --local-dir models/sd-vae --include "config.json" "diffusion_pytorch_model.bin"
          huggingface-cli download openai/whisper-tiny --local-dir models/whisper --include "config.json" "pytorch_model.bin" "preprocessor_config.json"
          gdown 154JgKpzCPW82qINcVieuPH3fZ2e0P812 -O models/face-parse-bisent/79999_iter.pth
          curl -sL https://download.pytorch.org/models/resnet18-5c106cde.pth -o models/face-parse-bisent/resnet18-5c106cde.pth
          ls -la models/*
      - name: Lipsync
        run: |
          git config --global user.name "rrs-bot"; git config --global user.email "rrs-bot@users.noreply.github.com"
          J=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- pipeline/experiments/lipsync-jobs | head -1)
          [ -z "$J" ] && J=$(git log -1 --name-only --format= -- pipeline/experiments/lipsync-jobs | head -1)
          git fetch -q origin experiment-output && git worktree add -q -B eo-work /tmp/eo origin/experiment-output
          python -c "import json,sys;d=json.load(open(sys.argv[1]));[it.update({k:'/tmp/eo/'+it[k][3:]}) for it in d['items'] for k in ('video','audio') if it[k].startswith('eo:')];json.dump(d,open('/tmp/job.json','w'))" "$J"
          OUT=/tmp/eo/runs/lipsync-${{ github.run_id }}
          python pipeline/experiments/lipsync.py /tmp/job.json $OUT/work || echo "립싱크 실패"
          mkdir -p $OUT && find $OUT/work/res -name '*.mp4' -exec cp {} $OUT/ \; ; rm -rf $OUT/work
          cd /tmp/eo && git add runs && git commit -qm "lipsync ${{ github.run_id }}" && for i in 1 2 3; do git pull -q --rebase origin experiment-output && git push -q origin HEAD:experiment-output && break; sleep 5; done
