name: experiment-images
# 무료 CPU 러너에서 실사 이미지 모델 실험. 결과는 experiment-output 브랜치에 커밋한다.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "모델 (rv51 vega)"
        default: "rv51 vega"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install CPU torch + diffusers
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install diffusers==0.31.0 transformers==4.46.3 accelerate==1.1.1 peft==0.13.2 safetensors pillow
      - name: Generate
        run: |
          nproc; free -g
          python pipeline/experiments/realistic_images.py ${{ inputs.models }}
      - name: Push results
        if: always()
        run: |
          mkdir -p /tmp/o && cp -r out /tmp/o/ || true
          git config user.name "rrs-bot"; git config user.email "rrs-bot@users.noreply.github.com"
          git fetch origin experiment-output || true
          git checkout -B experiment-output
          git rm -rq --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p runs/${{ github.run_id }} && cp -r /tmp/o/out/* runs/${{ github.run_id }}/ || true
          git add runs && git commit -qm "experiment ${{ github.run_id }}" && git push -f origin experiment-output
