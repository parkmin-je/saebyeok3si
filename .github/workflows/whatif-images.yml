name: whatif-images
# 만약에 쇼츠 그림 만들기 (DreamShaper XL Lightning, CPU). pipeline/whatif/*-shots.json 을 올리면
# 8대가 나눠 그려 experiment-output 브랜치 runs/img-<run>/ 에 올린다.
on:
  push:
    branches: [feat/sample-video-veo]
    paths: [pipeline/whatif/*-shots.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q "diffusers==0.32.2" "transformers==4.47.1" accelerate safetensors pillow
      - name: Generate
        run: |
          J=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'pipeline/whatif/*-shots.json' | head -1)
          [ -z "$J" ] && J=$(ls pipeline/whatif/*-shots.json | tail -1)
          python pipeline/whatif/gen_images.py "$J" out ${{ matrix.shard }} 8
      - name: Push
        run: |
          ls out/*.jpg >/dev/null 2>&1 || { echo "이 몫은 그림 없음"; exit 0; }
          git config --global user.name "rrs-bot"; git config --global user.email "rrs-bot@users.noreply.github.com"
          git fetch -q origin experiment-output && git worktree add -q -B eo-${{ matrix.shard }} /tmp/eo origin/experiment-output
          mkdir -p /tmp/eo/runs/img-${{ github.run_id }} && cp out/*.jpg /tmp/eo/runs/img-${{ github.run_id }}/
          cd /tmp/eo && git add runs && git commit -qm "img ${{ github.run_id }} shard ${{ matrix.shard }}" && for i in 1 2 3 4 5 6; do git pull -q --rebase origin experiment-output && git push -q origin HEAD:experiment-output && break; sleep $((RANDOM % 10 + 3)); done
