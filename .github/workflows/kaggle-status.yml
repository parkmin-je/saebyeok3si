name: kaggle-status
# Kaggle 커널 상태만 빠르게 확인 (이 세션 네트워크에서는 Kaggle이 막혀 있어서)
on:
  push:
    branches: [feat/sample-video-veo]
    paths: [.github/workflows/kaggle-status.yml, pipeline/kaggle/status-ping.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q kaggle six
      - env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          mkdir -p ~/.kaggle && echo "$KAGGLE_JSON" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
          U=$(python -c "import json,os;print(json.loads(os.environ['KAGGLE_JSON'])['username'])")
          kaggle quota || true
          # collect <커널이름>: 끝난 커널 결과를 experiment-output runs/kaggle-<커널이름>/ 으로 가져오기
          C=$(grep '^collect ' pipeline/kaggle/status-ping.txt 2>/dev/null | cut -d' ' -f2- | tr '\n' ' ')
          if [ -n "$C" ]; then
            git config --global user.name "rrs-bot"; git config --global user.email "rrs-bot@users.noreply.github.com"
            git fetch -q origin experiment-output && git worktree add -q -B eo-work /tmp/eo origin/experiment-output
            for k in $C; do
              st=$(kaggle kernels status "$U/$k" 2>&1); echo "$st"
              case "$st" in *COMPLETE*|*ERROR*) mkdir -p /tmp/eo/runs/kaggle-$k && kaggle kernels output "$U/$k" -p /tmp/eo/runs/kaggle-$k || true;; esac
            done
            (cd /tmp/eo && git add runs && git commit -qm "kaggle collect" && for i in 1 2 3; do git pull -q --rebase origin experiment-output && git push -q origin HEAD:experiment-output && break; done) || true
          fi
          if grep -q '^cpudiag' pipeline/kaggle/status-ping.txt; then
            mkdir -p /tmp/cd && printf 'import os,subprocess\nprint(os.cpu_count(), subprocess.run(["free","-g"],capture_output=True,text=True).stdout)\n' > /tmp/cd/main.py
            python -c "import json,sys;u=sys.argv[1];json.dump({'id':f'{u}/rrs-cpudiag','title':'rrs-cpudiag','code_file':'main.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':False,'enable_internet':True},open('/tmp/cd/kernel-metadata.json','w'))" "$U"
            kaggle kernels push -p /tmp/cd || true
            sleep 120
            kaggle kernels status "$U/rrs-cpudiag" || true; kaggle kernels logs "$U/rrs-cpudiag" 2>&1 | tail -c 1500 || true
          fi
          if grep -q '^gpudiag' pipeline/kaggle/status-ping.txt; then
            mkdir -p /tmp/gd && printf 'import subprocess\nprint(subprocess.run(["nvidia-smi"],capture_output=True,text=True).stdout)\n' > /tmp/gd/main.py
            for acc in NvidiaTeslaT4 none; do
              python -c "import json,sys;u,a=sys.argv[1:];m={'id':f'{u}/rrs-gpudiag-{a.lower()}','title':f'rrs-gpudiag-{a.lower()}','code_file':'main.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':True,'enable_internet':True};json.dump(m,open('/tmp/gd/kernel-metadata.json','w'))" "$U" "$acc"
              if [ $acc = none ]; then kaggle kernels push -p /tmp/gd || true; else kaggle kernels push -p /tmp/gd --accelerator $acc || true; fi
            done
            sleep 150
            for a in nvidiateslat4 none; do kaggle kernels status "$U/rrs-gpudiag-$a" || true; kaggle kernels logs "$U/rrs-gpudiag-$a" 2>&1 | tail -c 1500 || true; done
          fi
          for k in $(grep '^delete ' pipeline/kaggle/status-ping.txt 2>/dev/null | cut -d' ' -f2); do echo "== delete $k"; kaggle kernels delete -y "$U/$k" || true; done
          kaggle kernels list --mine --page-size 20 || true
          for k in $(kaggle kernels list --mine --page-size 20 --csv | tail -n +2 | cut -d, -f1); do
            echo "== $k"; kaggle kernels status "$k" || true
            case "$k" in *rrs-wan*|*rrs-stills*|*rrs-cpu*) kaggle kernels logs "$k" 2>&1 | tail -c 3000 || true;; esac
          done
