[project]
name = "kongsawon-studio"
version = "0.1.0"
description = "콩사원 AI 생존기 쇼츠 제작기"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]
live = ["websockets>=13"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
