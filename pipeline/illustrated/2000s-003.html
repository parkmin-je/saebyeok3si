<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>2000s-003 술래는 일부러 잡혔다</title>
<!--
  Claude가 직접 그린 장면 일러스트 (무료 제작 방식). 2000년대 순정만화·학원물 톤.
  window.render(t): t초 시점 화면을 그린다 (결정적). window.setTimeline(scenes): 장면 시작/끝 덮어쓰기.
-->
<style>
  @font-face { font-family: "Myeongjo"; src: url("../../assets/fonts/NanumMyeongjoBold.ttf"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  svg { display: block; }
  text { font-family: "Myeongjo", serif; }
</style>
</head>
<body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur50"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="grainF" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.25  0 0 0 0.7 -0.2"/>
    </filter>
    <pattern id="tone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3.2" fill="#ffffff" opacity="0.55"/>
    </pattern>
    <radialGradient id="vign" cx="50%" cy="45%" r="78%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0d1f" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="capShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120a18" stop-opacity="0"/><stop offset="0.45" stop-color="#120a18" stop-opacity="0.32"/><stop offset="1" stop-color="#120a18" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a52"/><stop offset="0.55" stop-color="#5a4f7c"/><stop offset="1" stop-color="#b98a9c"/>
    </linearGradient>
    <linearGradient id="skyGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc3ef"/><stop offset="0.45" stop-color="#ffd7a8"/><stop offset="1" stop-color="#ffb38a"/>
    </linearGradient>
    <linearGradient id="skySunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5aa6"/><stop offset="0.4" stop-color="#ff8f8f"/><stop offset="0.75" stop-color="#ffbf7a"/><stop offset="1" stop-color="#ffe0a8"/>
    </linearGradient>
    <linearGradient id="sandWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2cf9b"/><stop offset="1" stop-color="#d9a774"/>
    </linearGradient>
    <linearGradient id="sandCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7c96"/><stop offset="1" stop-color="#5b4f69"/>
    </linearGradient>
    <linearGradient id="pinkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1e3"/><stop offset="0.5" stop-color="#ffe9c9"/><stop offset="1" stop-color="#ffc2d6"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5c48"/><stop offset="1" stop-color="#244a3a"/>
    </linearGradient>
    <linearGradient id="wallClass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e9d7"/><stop offset="1" stop-color="#e6d6bc"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6dc" stop-opacity="0.6"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.9"/><stop offset="1" stop-color="#bfe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d6"/><stop offset="0.4" stop-color="#ffd08a" stop-opacity="0.9"/><stop offset="1" stop-color="#ff9a7a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1080" height="1920"/></clipPath>
  </defs>
  <g id="scenes" clip-path="url(#frame)"></g>
  <rect width="1080" height="1920" filter="url(#grainF)" opacity="0.35" pointer-events="none"/>
  <rect width="1080" height="1920" fill="url(#vign)" pointer-events="none"/>
  <rect y="1180" width="1080" height="740" fill="url(#capShade)" pointer-events="none"/>
  <rect id="fadeBlack" width="1080" height="1920" fill="#000" opacity="0"/>
</svg>

<script>
const NS = "http://www.w3.org/2000/svg";
const SCENES = [ { start: 0, end: 5 }, { start: 5, end: 16 }, { start: 16, end: 26 },
                 { start: 26, end: 37 }, { start: 37, end: 48 }, { start: 48, end: 55 } ];
const XF = 0.7;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, x) => a + (b - a) * x;
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; }
function g(parent, attrs = {}) { return el("g", attrs, parent); }
function svg(parent, markup) { const w = g(parent); w.innerHTML = markup; return w; }
function cam(node, s, dx = 0, dy = 0, cx = 540, cy = 960) { node.setAttribute("transform", `translate(${cx + dx} ${cy + dy}) scale(${s}) translate(${-cx} ${-cy})`); }

/* ---------- 배경 소품 ---------- */
function apartments(tone, lit, seed = 4) {
  // 뒤쪽 아파트 단지 실루엣과 켜진 창문
  const r = rng(seed); let s = "";
  const blocks = [[-60, 520, 260], [210, 600, 230], [450, 470, 250], [720, 560, 240], [960, 500, 220]];
  for (const [x, top, w] of blocks) {
    s += `<rect x="${x}" y="${top}" width="${w}" height="${1250 - top}" fill="${tone}"/>`;
    s += `<rect x="${x + 20}" y="${top + 18}" width="${w - 40}" height="26" fill="#000" opacity="0.08"/>`;
    for (let y = top + 70; y < 1180; y += 52) for (let xx = x + 22; xx < x + w - 30; xx += 46)
      if (r() < lit) s += `<rect x="${xx}" y="${y}" width="26" height="30" fill="#ffe7a3" opacity="${0.55 + r() * 0.45}"/>`;
  }
  return s;
}
function jungleGym(x, y, scale = 1, colors = ["#e8524a", "#f6c445", "#4f8fdc"]) {
  // 정면 격자 + 윗면 + 옆 미끄럼틀. (x,y) = 왼쪽 아래 기준
  const cell = 150, n = 4, w = cell * n, h = cell * 3, d = 70;
  let s = `<g transform="translate(${x} ${y}) scale(${scale})" stroke-linecap="round">`;
  // 뒷면 (어둡게)
  for (let i = 0; i <= n; i++) s += `<line x1="${i * cell + d}" y1="${-d}" x2="${i * cell + d}" y2="${-h - d}" stroke="${colors[i % 3]}" stroke-width="12" opacity="0.55"/>`;
  for (let j = 0; j <= 3; j++) s += `<line x1="${d}" y1="${-j * cell - d}" x2="${w + d}" y2="${-j * cell - d}" stroke="${colors[(j + 1) % 3]}" stroke-width="12" opacity="0.55"/>`;
  // 윗면 연결
  for (let i = 0; i <= n; i++) s += `<line x1="${i * cell}" y1="${-h}" x2="${i * cell + d}" y2="${-h - d}" stroke="${colors[i % 3]}" stroke-width="14"/>`;
  // 앞면
  for (let i = 0; i <= n; i++) s += `<line x1="${i * cell}" y1="0" x2="${i * cell}" y2="${-h}" stroke="${colors[i % 3]}" stroke-width="16"/>`;
  for (let j = 1; j <= 3; j++) s += `<line x1="0" y1="${-j * cell}" x2="${w}" y2="${-j * cell}" stroke="${colors[(j + 1) % 3]}" stroke-width="16"/>`;
  // 미끄럼틀
  s += `<path d="M${w} ${-h + 20} L${w + 330} -30 L${w + 380} -30 L${w + 60} ${-h + 20} Z" fill="#f6c445" stroke="#c99520" stroke-width="6"/>`;
  s += `<path d="M${w + 10} ${-h} L${w + 340} -40" stroke="#fff3c4" stroke-width="8" opacity="0.7"/>`;
  return s + `</g>`;
}
function swingSet(x, y, seatAngle, child) {
  let s = `<g transform="translate(${x} ${y})">
    <path d="M-170 0 L-110 -560 M-50 0 L-110 -560 M170 0 L110 -560 M50 0 L110 -560" stroke="#4f8fdc" stroke-width="18" stroke-linecap="round"/>
    <line x1="-120" y1="-555" x2="120" y2="-555" stroke="#e8524a" stroke-width="20" stroke-linecap="round"/>
    <g transform="translate(0 -550) rotate(${seatAngle})">
      <line x1="-55" y1="0" x2="-55" y2="390" stroke="#8a8f99" stroke-width="5"/>
      <line x1="55" y1="0" x2="55" y2="390" stroke="#8a8f99" stroke-width="5"/>
      <rect x="-75" y="385" width="150" height="20" rx="6" fill="#e8524a"/>
      ${child || ""}
    </g></g>`;
  return s;
}
function streetLamp(x, y, on) {
  return `<g transform="translate(${x} ${y})">
    <rect x="-8" y="-640" width="16" height="640" fill="#3c3a4a"/>
    <path d="M0 -640 Q0 -690 60 -690 L90 -690" stroke="#3c3a4a" stroke-width="14" fill="none"/>
    <path d="M70 -700 L130 -700 L118 -672 L82 -672 Z" fill="#3c3a4a"/>
    ${on ? `<circle cx="100" cy="-660" r="160" fill="#ffe6a0" opacity="0.35" filter="url(#blur50)"/><ellipse cx="100" cy="-670" rx="22" ry="8" fill="#fff4c8"/>` : ""}
  </g>`;
}
function sparkle(x, y, r, o = 1, color = "#ffffff") {
  return `<path d="M${x} ${y - r} Q${x + r * 0.18} ${y - r * 0.18} ${x + r} ${y} Q${x + r * 0.18} ${y + r * 0.18} ${x} ${y + r} Q${x - r * 0.18} ${y + r * 0.18} ${x - r} ${y} Q${x - r * 0.18} ${y - r * 0.18} ${x} ${y - r} Z" fill="${color}" opacity="${o}"/>`;
}
function sparkles(t, seed, n, area, color) {
  const r = rng(seed); let s = "";
  for (let i = 0; i < n; i++) {
    const x = area[0] + r() * area[2], y = area[1] + r() * area[3], sz = 10 + r() * 26, ph = r() * 6.28, sp = 1.5 + r() * 2.5;
    const k = 0.5 + 0.5 * Math.sin(t * sp + ph);
    s += sparkle(x, y, sz * (0.4 + 0.6 * k), 0.3 + 0.7 * k, color);
  }
  return s;
}

/* ---------- 인물 (2000년대 만화풍) ---------- */
function person(o) {
  // o: x, y(발), s, girl, uniform, shirt, pants, armL/armR(각도), blush, eyes('open'|'closed'|'happy'), mouth('smile'|'o'|'flat'), face(-1 왼쪽~1 오른쪽), tail(포니테일 흔들림 각도), back(뒷모습)
  const skin = "#ffe2cc", hair = o.hairColor || (o.girl ? "#3a2433" : "#231d2b");
  const top = o.uniform ? "#2d3a6b" : (o.shirt || "#ffffff"), bottom = o.uniform ? "#26315a" : (o.pants || "#3d5a99");
  const f = o.face || 0;
  let s = `<g transform="translate(${o.x} ${o.y}) scale(${o.s || 1})">`;
  // 다리
  if (o.girl && o.uniform) {
    s += `<path d="M-80 -175 L80 -175 L95 -95 L-95 -95 Z" fill="${bottom}"/>`;
    s += `<rect x="-48" y="-100" width="30" height="100" fill="${skin}"/><rect x="18" y="-100" width="30" height="100" fill="${skin}"/>`;
    s += `<rect x="-50" y="-48" width="34" height="48" fill="#ffffff"/><rect x="16" y="-48" width="34" height="48" fill="#ffffff"/>`;
  } else {
    s += `<rect x="-55" y="-180" width="44" height="180" rx="12" fill="${bottom}"/><rect x="11" y="-180" width="44" height="180" rx="12" fill="${bottom}"/>`;
  }
  s += `<ellipse cx="-34" cy="-6" rx="34" ry="16" fill="#3a3340"/><ellipse cx="34" cy="-6" rx="34" ry="16" fill="#3a3340"/>`;
  // 팔
  const arm = (side, ang) => `<g transform="translate(${side * 72} -318) rotate(${ang})"><rect x="-18" y="0" width="36" height="150" rx="18" fill="${top}"/><circle cx="0" cy="158" r="20" fill="${skin}"/></g>`;
  s += arm(-1, o.armL ?? 12) + arm(1, o.armR ?? -12);
  // 몸통
  s += `<path d="M-82 -330 Q0 -350 82 -330 L90 -170 L-90 -170 Z" fill="${top}"/>`;
  if (o.uniform) {
    s += `<path d="M-30 -338 L0 -270 L30 -338 Z" fill="#ffffff"/>`;
    s += o.girl ? `<path d="M0 -300 L-28 -318 L-28 -282 Z M0 -300 L28 -318 L28 -282 Z" fill="#d43f4a"/><circle cx="0" cy="-300" r="8" fill="#b52f3a"/>`
                : `<path d="M-8 -300 L8 -300 L12 -240 L0 -228 L-12 -240 Z" fill="#7a2a3a"/>`;
    s += `<rect x="40" y="-300" width="26" height="8" fill="#e9e2cf"/>`;
  } else if (o.stripe) {
    for (let k = 0; k < 4; k++) s += `<rect x="-86" y="${-322 + k * 38}" width="172" height="14" fill="${o.stripe}" opacity="0.9"/>`;
  }
  // 머리
  s += `<rect x="-18" y="-352" width="36" height="26" fill="${skin}"/>`;
  if (o.back) {
    s += `<circle cx="0" cy="-440" r="96" fill="${hair}"/>`;
    if (o.girl) s += `<g transform="translate(0 -500) rotate(${o.tail || 0})"><path d="M-30 0 Q-60 120 -10 230 Q20 120 30 0 Z" fill="${hair}"/></g><circle cx="0" cy="-505" r="14" fill="#ff6f91"/>`;
    return s + `</g>`;
  }
  if (o.girl) s += `<g transform="translate(${70 - f * 20} -470) rotate(${(o.tail || 0) - 20})"><path d="M0 0 Q60 70 30 210 Q-5 120 -20 10 Z" fill="${hair}"/></g><circle cx="${66 - f * 20}" cy="-478" r="14" fill="#ff6f91"/>`;
  s += `<circle cx="0" cy="-440" r="96" fill="${skin}"/>`;
  s += `<path d="M-100 -430 Q-104 -548 0 -545 Q104 -548 100 -430 Q86 -470 60 -462 Q48 -500 14 -470 Q-12 -506 -40 -468 Q-74 -488 -100 -430 Z" fill="${hair}"/>`;
  if (o.girl) s += `<path d="M-100 -430 Q-112 -360 -96 -300 Q-84 -360 -80 -430 Z M100 -430 Q112 -360 96 -300 Q84 -360 80 -430 Z" fill="${hair}"/>`;
  const ex = f * 14, eyeY = -425;
  const eye = (cx) => {
    if (o.eyes === "closed") return `<path d="M${cx - 14} ${eyeY} Q${cx} ${eyeY + 10} ${cx + 14} ${eyeY}" stroke="#2a1e2e" stroke-width="5" fill="none"/>`;
    if (o.eyes === "happy") return `<path d="M${cx - 14} ${eyeY + 4} Q${cx} ${eyeY - 12} ${cx + 14} ${eyeY + 4}" stroke="#2a1e2e" stroke-width="6" fill="none"/>`;
    const rx = o.girl ? 13 : 10, ry = o.girl ? 20 : 15;
    return `<ellipse cx="${cx}" cy="${eyeY}" rx="${rx}" ry="${ry}" fill="#2a1e2e"/><circle cx="${cx - 4}" cy="${eyeY - 7}" r="${o.girl ? 5.5 : 4}" fill="#fff"/><circle cx="${cx + 4}" cy="${eyeY + 6}" r="2.5" fill="#fff" opacity="0.8"/>` +
      (o.girl ? `<path d="M${cx - 16} ${eyeY - 16} L${cx - 22} ${eyeY - 22} M${cx + 14} ${eyeY - 18} L${cx + 20} ${eyeY - 24}" stroke="#2a1e2e" stroke-width="3"/>` : "");
  };
  s += eye(-36 + ex) + eye(36 + ex);
  if (o.blush) s += `<ellipse cx="${-58 + ex}" cy="-388" rx="22" ry="10" fill="#ff7a9a" opacity="${o.blush}"/><ellipse cx="${58 + ex}" cy="-388" rx="22" ry="10" fill="#ff7a9a" opacity="${o.blush}"/>`;
  if (o.blush > 0.6 && !o.girl) s += `<path d="M${-70 + ex} -400 l12 -6 M${-62 + ex} -392 l12 -6 M${-54 + ex} -384 l12 -6" stroke="#e0506e" stroke-width="3"/>`;
  const m = o.mouth || "smile", mx = ex;
  s += m === "o" ? `<ellipse cx="${mx}" cy="-372" rx="9" ry="11" fill="#9b3a4a"/>`
     : m === "flat" ? `<path d="M${mx - 12} -372 L${mx + 12} -372" stroke="#7a3040" stroke-width="5" stroke-linecap="round"/>`
     : m === "grin" ? `<path d="M${mx - 22} -380 Q${mx} -350 ${mx + 22} -380 Z" fill="#9b3a4a"/>`
     : `<path d="M${mx - 14} -376 Q${mx} -362 ${mx + 14} -376" stroke="#7a3040" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if (o.sweat) s += `<path d="M${95} -500 q 14 26 0 36 q -14 -10 0 -36 Z" fill="#bfe6ff" stroke="#6fb3e0" stroke-width="2"/>`;
  return s + `</g>`;
}
function snackBox(x, y, rot, s = 1) { // 상표 없는 분홍 막대과자 상자
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
    <rect x="-40" y="-150" width="80" height="300" rx="6" fill="#ff8fb3" stroke="#e0507e" stroke-width="5"/>
    <rect x="-40" y="-150" width="80" height="40" fill="#ff6f9a"/>
    <path d="M0 -40 C -28 -70 -42 -30 0 6 C 42 -30 28 -70 0 -40 Z" fill="#fff" opacity="0.95"/>
    <rect x="-30" y="40" width="60" height="8" fill="#fff" opacity="0.7"/><rect x="-30" y="60" width="44" height="8" fill="#fff" opacity="0.7"/>
  </g>`;
}

/* ---------- 장면 ---------- */
const root = document.getElementById("scenes");
const S = SCENES.map((sc, i) => { const w = g(root, { id: `s${i + 1}`, opacity: 0 }); const c = g(w); return { ...sc, wrap: w, cam: c }; });

function playgroundBase(c, { sky, sand, apt, lit, lamp }) {
  svg(c, `<rect x="-300" y="-300" width="1680" height="1600" fill="url(#${sky})"/>
    ${apartments(apt, lit)}
    <rect x="-300" y="1240" width="1680" height="30" fill="#5d4f63" opacity="0.6"/>
    <rect x="-300" y="1260" width="1680" height="900" fill="url(#${sand})"/>
    ${lamp !== undefined ? streetLamp(980, 1330, lamp) : ""}`);
}

// 1. 지금의 놀이터: 그네에 혼자 앉아 휴대폰 보는 아이
(function () {
  const sc = S[0], c = sc.cam;
  playgroundBase(c, { sky: "skyDusk", sand: "sandCool", apt: "#2b2740", lit: 0.45, lamp: true });
  svg(c, `<g opacity="0.75">${jungleGym(470, 1420, 0.75, ["#a0505a", "#a08a4a", "#4f6a9a"])}</g>`);
  sc.swing = g(c);
  sc.update = (t, d = 5) => {
    cam(c, lerp(1.0, 1.18, ease(t / d)), 60, 0, 300, 1250);
    const glowK = 0.85 + 0.15 * Math.sin(t * 6.1) * Math.sin(t * 2.3);
    const kid = `<g transform="translate(0 395)">
      ${person({ x: 0, y: 165, s: 0.55, shirt: "#5b6b8a", pants: "#2f3550", armL: -40, armR: 40, eyes: "open", mouth: "flat", face: 0 }).replace('scale(0.55)', 'scale(0.55)')}
      <rect x="-22" y="-60" width="44" height="70" rx="8" fill="#1c1c24"/>
      <rect x="-18" y="-55" width="36" height="58" rx="5" fill="#d8f0ff" opacity="${glowK}"/>
      <ellipse cx="0" cy="-150" rx="140" ry="160" fill="url(#phoneGlow)" opacity="${0.55 * glowK}" style="mix-blend-mode:screen"/>
    </g>`;
    sc.swing.innerHTML = swingSet(260, 1500, Math.sin(t * 1.1) * 3, kid);
  };
})();

// 2. 2004년 놀이터: 지옥탈출
(function () {
  const sc = S[1], c = sc.cam;
  playgroundBase(c, { sky: "skyGold", sand: "sandWarm", apt: "#c79a8a", lit: 0.05 });
  svg(c, `<circle cx="860" cy="420" r="260" fill="url(#sun)"/>`);
  svg(c, jungleGym(160, 1520, 1.0));
  sc.kids = g(c); sc.fx = g(sc.wrap);
  sc.update = (t, d = 11) => {
    cam(c, 1.12, lerp(70, -70, ease(t / d)), 0, 540, 1250);
    const b = (k) => Math.sin(t * 3 + k) * 6;
    let k = "";
    // 정글짐 위 친구들 (작게)
    k += person({ x: 300, y: 1225 + b(1), s: 0.42, shirt: "#ffd24a", pants: "#3d5a99", armL: -150, armR: 160, eyes: "happy", mouth: "grin", blush: 0.4 });
    k += person({ x: 760, y: 1075 + b(2), s: 0.42, shirt: "#7bd389", pants: "#4a4a6a", armL: -160, armR: -20, eyes: "open", mouth: "o", blush: 0.3 });
    k += person({ x: 600, y: 1375 + b(3), s: 0.42, shirt: "#a98cf0", pants: "#3d3d5a", armL: -170, armR: 150, eyes: "happy", mouth: "grin", girl: true, tail: Math.sin(t * 4) * 10 });
    // 지수: 정글짐 위에서 민호를 가리킴

window.DURATION = SCENES[SCENES.length - 1].end;
window.setTimeline = function (scenes) { scenes.forEach((x, i) => { S[i].start = x.start; S[i].end = x.end; }); window.DURATION = scenes[scenes.length - 1].end; };
window.render = function (t) {
  S.forEach((sc, i) => {
    const fin = i === 0 ? 1 : clamp((t - (sc.start - XF / 2)) / XF);
    const fout = i === S.length - 1 ? 1 : clamp(((sc.end + XF / 2) - t) / XF);
    const o = Math.min(fin, fout);
    sc.wrap.setAttribute("opacity", o);
    sc.wrap.style.display = o > 0 ? "" : "none";
    if (o > 0) sc.update(t - sc.start, sc.end - sc.start);
  });
  document.getElementById("fadeBlack").setAttribute("opacity", clamp((t - (window.DURATION - 0.6)) / 0.6) * 0.85);
};
window.ready = document.fonts.ready.then(() => { window.render(0); return true; });
